<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Nest Interactive App</title>
    <!-- Load Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Linking stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- Navbar section -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">Store</span>
            <span class="text-white">Cart Items: <span id="cart-count">0</span></span>
        </div>
    </nav>
    <!-- Category section -->
    <div class="container-fluid px-4 mb-5">
        <div class="row mb-4">
            <div class="col-lg-8 mb-3 mb-lg-0">
                <div id="category-buttons" class="btn-group flex-wrap" role="group">
                    <button class="btn btn-dark active" data-category="all">All</button>
                    <button class="btn btn-outline-dark" data-category="electronics">Electronics</button>
                    <button class="btn btn-outline-dark" data-category="jewelery">Jewellery</button>
                    <button class="btn btn-outline-dark" data-category="men's clothing">Men's clothing</button>
                    <button class="btn btn-outline-dark" data-category="women's clothing">Women's clothing</button>
                </div>
            </div>
            <div class="col-lg-4">
                <input type="text" id="search-input" class="form-control" placeholder="Search products...">
            </div>
        </div>

        <div class="row">
            <!-- Product Grid section -->
            <div class="col-md-9 mb-4">
                <div id="product-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-3">
                    <div class="col-12 text-center text-muted py-5">Loading products...</div>
                </div>
            </div>

            <!-- Cart section -->
            <div class="col-md-3">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Shopping Cart</h4>
                        <div id="cart-items" class="mb-3">
                            <p class="text-muted">Your cart is empty...</p>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total value:</span>
                            <span id="cart-total">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>


</body>

</html>
